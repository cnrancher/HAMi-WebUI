name: Build and Push Images

on:
  push:
    branches: [ "release-1.2.0" ]
    tags:
      - v[0-9]+.[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+
  pull_request:
    branches: [ "main" ]

env:
  GO_VERSION: "1.25.1"

jobs:
  build-and-push-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get branch names.
        id: branch-names
        uses: tj-actions/branch-names@v8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to TCR
        uses: docker/login-action@v3.1.0
        with:
          registry: registry.rancher.cn
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: registry.rancher.cn/cnrancher/hami-webui-fe-oss:${{ steps.branch-names.outputs.current_branch || steps.branch-names.outputs.tag }}

  # build-and-push-backend:
