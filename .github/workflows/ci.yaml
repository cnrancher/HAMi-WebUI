  #     - name: Build and push backend image
  #       uses: docker/build-push-action@v6
  #       with:
  #         context: ./server
  #         platforms: linux/amd64,linux/arm64
  #         push: ${{ github.event_name != 'pull_request' }}
  #         tags: projecthami/hami-webui-be-oss:${{ steps.branch-names.outputs.tag || steps.branch-names.outputs.current_branch == 'main' && 'main' || format('pr-{0}', github.run_number) }}
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max

  image-sign:
    permissions:
      contents: read
      id-token: write # required for hangar sign OIDC keyless mode
    runs-on: ubuntu-latest
    needs: [ build-and-push-frontend]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to TCR
      uses: docker/login-action@v3
      with:
        registry: registry.rancher.cn
        username: ${{ secrets.TCR_USERNAME }}
        password: ${{ secrets.TCR_TOKEN }}
    - name: Get branch names.
      id: branch-names
      uses: tj-actions/branch-names@v8
    - name: Hangar Sign
      uses: cnrancher/hangar/.github/actions/hangar-sign@main
      with:
        version: v1.9.0
        images: |
          registry.rancher.cn/cnrancher/hami-webui-fe-oss:${{ steps.branch-names.outputs.current_branch || steps.branch-names.outputs.tag }}
